name: Build WA2 readable iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned iPhone/iPad IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out your WA2 fork
        uses: actions/checkout@v4

      - name: Apply DynaPuff rendering and natural text wrapping
        shell: bash
        run: |
          git apply <<'WA2_PATCH'
          diff --git a/script/Wa2Label.cs b/script/Wa2Label.cs
