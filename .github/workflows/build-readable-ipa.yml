          +									(i + 1 < Text.Length && Text[i + 1] == ' ');
          +								if (drawX > 0 && !hasSpace)
          +								{
          +									float spaceWidth = GlyphAdvance(' ', modFontSize, LineSpacing, latinRun);
          +									float nextWordWidth = UpcomingWordWidth(Text, i + 1, modFontSize, LineSpacing);
          +									if (nextWordWidth <= maxLineWidth && drawX + spaceWidth + nextWordWidth > maxLineWidth)
          +									{
          +										drawY += FontSize + ParagraphSpacing;
          +										drawX = 0;
          +										latinRun = "";
          +									}
          +									else
          +									{
          +										drawX += spaceWidth;
          +										latinRun += " ";
          +									}
          +								}
          +							}
          +							else if (drawX > 0)
           							{
          +								lastDrawX = drawX;
           								drawY += FontSize + ParagraphSpacing;
           								drawX = 0;
          +								latinRun = "";
           							}
           
           							break;
          @@ -474,6 +556,30 @@ public partial class Wa2Label : Node2D
           				case '~':
           					break;
           				default:
          +					float glyphAdvance = GlyphAdvance(Text[i], modFontSize, LineSpacing, latinRun);
          +					// In English, wrap according to the actual Latin advance instead
          +					// of a fixed 28-character grid, preferably at word boundaries.
          +					bool startsWord = Text[i] != ' ' &&
          +						(i == 0 || Text[i - 1] == ' ' ||
          +						 (i >= 2 && Text[i - 2] == '\\' && Text[i - 1] == 'n'));
          +					float upcomingWidth = englishLayout && startsWord
          +						? UpcomingWordWidth(Text, i, modFontSize, LineSpacing) : 0;
          +					if (englishLayout && drawX > 0 &&
