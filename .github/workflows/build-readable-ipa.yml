           	private static readonly HashSet<char> ReportedMissing = new();
          +	private static bool UsesLatinFont(char ch) => (ch >= ' ' && ch <= '~') || ch is 'â' or 'â' or 'â' or 'â' or 'â' or 'â' or 'â¦';
          +	// DynaPuff is a wide, round typeface. Slight scaling fits the existing line
          +	// height and prevents clipping inside the original VN dialogue frame.
          +	private static int LatinFontSize(int cellSize) => Math.Max(12, Mathf.RoundToInt(cellSize * 0.89f));
          +	// Query the actual font for each successive prefix so advances preserve
          +	// kerning, instead of using guessed fixed-width bitmap character cells.
          +	private float GlyphAdvance(char ch, int size, int lineSpacing, string latinRun = "")
          +	{
          +		if (_latinFont != null && UsesLatinFont(ch))
          +		{
          +			int pointSize = LatinFontSize(size);
          +			float before = _latinFont.GetStringSize(latinRun, fontSize: pointSize).X;
          +			float after = _latinFont.GetStringSize(latinRun + ch, fontSize: pointSize).X;
          +			return Math.Max(1f, after - before + lineSpacing);
          +		}
          +		if (ch > 0x7f)
          +			return Math.Max(1, size + lineSpacing);
          +		float width = ch switch
          +		{
          +			' ' => 0.42f,
          +			'i' or 'j' or 'l' or 'I' or '!' or '.' or ',' or ':' or ';' or '\'' or '`' or '|' => 0.34f,
          +			'f' or 'r' or 't' or '(' or ')' or '[' or ']' or '{' or '}' => 0.46f,
          +			'M' or 'W' or '@' or '%' or '&' => 0.90f,
          +			_ => 0.63f
          +		};
          +		return Math.Max(1, Mathf.RoundToInt(size * width) + lineSpacing);
          +	}
          +	// Look ahead at an English word so wrapping happens before the word, rather
          +	// than cutting it in half at the right edge of the dialogue panel.
          +	private float UpcomingWordWidth(string text, int start, int size, int lineSpacing)
          +	{
          +		float width = 0;
          +		string latinRun = "";
          +		for (int i = start; i < text.Length; i++)
          +		{
          +			char ch = text[i];
          +			if (char.IsWhiteSpace(ch) || ch is '<' or '>' or '\\' or '|')
          +				break;
          +			width += GlyphAdvance(ch, size, lineSpacing, latinRun);
          +			latinRun = UsesLatinFont(ch) ? latinRun + ch : "";
          +		}
          +		return width;
          +	}
