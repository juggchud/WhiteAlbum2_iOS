          +			int pointSize = LatinFontSize(r.Size);
          +			float baseline = r.Y + (r.Size - _latinFont.GetHeight(pointSize)) * 0.5f + _latinFont.GetAscent(pointSize);
          +			Vector2 origin = new(r.X, baseline);
          +			string glyph = r.Chr.ToString();
          +			if (shadowPass)
          +				DrawStringOutline(_latinFont, origin, glyph, HorizontalAlignment.Left, -1, pointSize, 2,
          +					new Color(0.08f, 0.08f, 0.08f, r.Alpha * ShadowColor.A));
          +			else
          +				DrawString(_latinFont, origin, glyph, HorizontalAlignment.Left, -1, pointSize,
          +					new Color(Color.R, Color.G, Color.B, r.Alpha));
          +			return;
          +		}
           		if (!Wa2Def.FontMap.TryGetValue(r.Chr, out int pos))
           		{
           			if (!shadowPass && ReportedMissing.Add(r.Chr))
          @@ -563,4 +688,4 @@ public partial class Wa2Label : Node2D
