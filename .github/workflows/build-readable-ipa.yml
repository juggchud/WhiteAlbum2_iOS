      - name: Bundle DynaPuff font and open-font license
        shell: bash
        run: |
          mkdir -p assets/fonts/dynapuff assets/legal
          curl --globoff -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/dynapuff/DynaPuff%5Bwdth%2Cwght%5D.ttf' -o assets/fonts/dynapuff/DynaPuff.ttf
          echo 'c3752fc6dd8aaa46a88637f061a9a4e6ab44c02c5f0afd65528b91ae8ff6f948  assets/fonts/dynapuff/DynaPuff.ttf' | shasum -a 256 --check
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/dynapuff/OFL.txt' -o assets/legal/DynaPuff-OFL.txt

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compile C# changes
        run: |
          dotnet build wa2.csproj --configuration Release

      - name: Install Godot 4.5.1 .NET and iOS export template
        shell: bash
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          mkdir -p "$RUNNER_TEMP/wa2-godot" build/templates
          curl -fL --retry 3 "$base/Godot_v4.5.1-stable_mono_macos.universal.zip" -o "$RUNNER_TEMP/godot-mono.zip"
          unzip -q "$RUNNER_TEMP/godot-mono.zip" -d "$RUNNER_TEMP/wa2-godot"
          GODOT_BIN=$(find "$RUNNER_TEMP/wa2-godot" -type f \( -name Godot -o -name Godot_mono \) -path '*/Contents/MacOS/*' -print -quit)
          if [ -z "$GODOT_BIN" ]; then
            echo 'Unable to locate the Godot .NET executable' >&2
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version

          curl -fL --retry 3 "$base/Godot_v4.5.1-stable_mono_export_templates.tpz" -o "$RUNNER_TEMP/godot-templates.tpz"
          templates="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable.mono"
          mkdir -p "$templates"
          unzip -q -o "$RUNNER_TEMP/godot-templates.tpz" 'templates/ios.zip' 'templates/version.txt' -d "$RUNNER_TEMP/wa2-godot"
          cp "$RUNNER_TEMP/wa2-godot/templates/ios.zip" "$templates/ios.zip"
          cp "$RUNNER_TEMP/wa2-godot/templates/version.txt" "$templates/version.txt"
          cp "$templates/ios.zip" build/templates/ios-mono-arm64.zip

      - name: Export Xcode project and unsigned IPA
        shell: bash
        run: |
          xcodebuild -version
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --editor --import
          "$GODOT_BIN" --headless --path . --export-release iOS build/ios/WA2.ipa
          python3 tools/prepare_ios_project.py build/ios
          xcodebuild -project build/ios/WA2.xcodeproj -scheme WA2 -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build -quiet
          python3 tools/package_ipa.py \
            build/ios-derived/Build/Products/Release-iphoneos/WA2.app \
            build/WA2-iPhone-iPad-Readable.ipa

      - name: Downloadable IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA2-Readable-iPhone-iPad-Unsigned
          path: build/WA2-iPhone-iPad-Readable.ipa
          if-no-files-found: error
          
